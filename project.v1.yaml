schema_version: "libre-ai.project.v1"
project: "personal-knowledge-workspace"
repository: "libre-ai/personal-knowledge-workspace"
kind: "product"
layer: "couche-1"
statement:
  for: "contributors assessing and developing this project's intended uses"
  who_faces: "recovered sources whose current integrated behavior still requires verification"
  enables: "inspecting the recovered implementation and running its declared checks before admission"
  producing:
    - "reproducible qualification evidence for the intended scope"
  without_depending_on:
    - "an implicit transfer of historical authority or an assumed passing CI run"
summary: "personal-knowledge-workspace: recovered sources with documentary integration under review."
current_situation: "Recovered source snapshot c81ad3426f4118fa7c5e4ffe3f16374e54ff3491 is present. Product tests and CI were not rerun for this documentary integration; historical evidence is not qualification of this tree. No product admission or authority transfer is established. Historical responsibilities came from the former libre-ai/notebook repository, which is no longer present in the organization."
scope:
  - "Write and revise notes as your understanding develops."
  - "Find information in your collection without having to remember where you put it."
  - "Export a chosen selection and understand what a backup would allow you to recover."
non_goals:
  - "Claiming operational readiness merely from the presence of recovered code."
  - "Transferring historical authority or consumers without separate reviewed admission."
dependencies:
  - "on": "libre-ai/project-governance"
    why: "Current fleet doctrine and reusable verification workflows."
    pinned: "github:libre-ai/project-governance#75d6ea085b18cb15d450d7f0f5b1ba9d69645800"
products:
  - id: "P04"
    code: "apps/desktop"
maturity: "idea"
confidence: "medium"
exposure: "idea"
freshness:
  last_verified_on: "2026-10-07"
scope_stability: "unstable"
phases:
  - id: "admission"
    title: "Bounded capability admission"
    product: "P04"
    delivers: "A person can capture and edit notes, find them again, export a chosen selection and restore their notes from a backup."
    note: "Recovered code is present. Documentary checks do not accept product qualification criteria."
    exit_criteria:
      - id: "qualified-scope"
        text: "Demonstrate a complete capture, edit, retrieval and controlled-export journey using synthetic notes. Verify backup and restoration, incorrect credentials, damaged input and interrupted operations against the actual cryptographic components. Measure browser behavior and resource limits on the exact supported runtimes. Test storage, deletion and network behavior before claiming locality, confidentiality or recoverability."
        weight: 1
        status: "pending"
  - id: "p06-passages"
    title: "Anchored passages and excluded-corpus guard"
    product: "P06"
    delivers: "A person can derive passages from their local Markdown notes, each pointing back to its file and line, and check that no note of an excluded corpus is among them."
    note: "Opened to code by the owner's decision of 2026-11-19, for the local scope only: no language model, derived from the Markdown folder (docs/cahier-des-charges.md section 4.1, EF-P06-1 to EF-P06-5). Code place: crates/p06-passages, package libre-ai-p06-passages, created by work package WP-9 of docs/prd.md; the products entry for P06 is added by the first pull request that tracks a file under that path. The full-text index of P04 stays in crates/notebook-vault."
    exit_criteria:
      - id: "passages-and-guard"
        text: "CA-50 to CA-53 of docs/cahier-des-charges.md pass: line-preserving text view and title; whole-line passages bounded by max with overlap, a line longer than max cut into prefixed pieces, a minimum length given as a parameter; passages rebuilt identically from the folder alone, which stays byte-identical; the guard prints its counters, fails on a path or fingerprint hit and on an empty reference, and prints no reference value."
        weight: 1
        status: "pending"
hypothesis: "The intended uses described in README.md can support a useful bounded product once their activation criteria are independently qualified."
evidence_required:
  - "Demonstrate a complete capture, edit, retrieval and controlled-export journey using synthetic notes. Verify backup and restoration, incorrect credentials, damaged input and interrupted operations against the actual cryptographic components. Measure browser behavior and resource limits on the exact supported runtimes. Test storage, deletion and network behavior before claiming locality, confidentiality or recoverability."
promotion_criteria:
  - to: "spec-published"
    when: "A bounded specification and its acceptance criteria are reviewed and explicitly admitted."
kill_predicates: []
benchmark:
  none: "No benchmark was executed for this integrated tree."
