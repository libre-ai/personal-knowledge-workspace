kill_predicates:
  - id: "ab-3-gate-b-red-twice"
    predicate: "Gate B campaigns replayed on the desktop-arm64-high-memory-reference class (CA-14) fail twice in a row on two corrected candidates, for a cause other than the refusal by the historical fingerprint QUALIFIED_CORE_SHA256 (Y41): the apps/notebook web host is withdrawn and only notebook-core is kept, as the library of the encrypted replica."
    source: "docs/cahier-des-charges.md (AB-3)"
  - id: "ab-4-vendored-aes-without-provenance"
    predicate: "When the NOTEBOOK_BACKUP_FEATURE_ENABLED feature gate is lifted, the vendored patch third_party/rustcrypto-aes-0.8.4 still has no I-28 provenance gate in bun run check and is not replaced by an equivalent published version: the encrypted backup path in the browser is abandoned for the native core alone."
    source: "docs/cahier-des-charges.md (AB-4)"
  - id: "ab-5-commons-cover-the-need"
    predicate: "For P03, P05, P06 or P07, a commons that is not archived, pushed less than 365 days before the measure and under a licence admitted by I-11 covers the need with no gap found by the parity matrix run line by line: no code is written in this repository for that P-xx and its catalogue line becomes integration."
    source: "docs/cahier-des-charges.md (AB-5)"
  - id: "ab-6-p04-not-used"
    predicate: "The local journal and the owner script (CA-31), read on day 29 of a window of 28 consecutive days, give fewer than 24 days with a note created or changed in P04, or show a launch of the previous notes tool: the P04 part of the repository returns to freeze."
    window: "28 consecutive days, read on day 29"
    source: "docs/cahier-des-charges.md (AB-6)"
benchmark:
