phases:
  - id: "admission"
    title: "Bounded capability admission"
    note: "Recovered code is present. Documentary checks do not accept product qualification criteria."
    exit_criteria:
      - id: "qualified-scope"
        text: "Demonstrate a complete capture, edit, retrieval and controlled-export journey using synthetic notes. Verify backup and restoration, incorrect credentials, damaged input and interrupted operations against the actual cryptographic components. Measure browser behavior and resource limits on the exact supported runtimes. Test storage, deletion and network behavior before claiming locality, confidentiality or recoverability."
        weight: 1
        status: "pending"
  - id: "p04-qualification"
    title: "P04 qualification in the Tauri 2 shell (ADR-0057)"
    note: "Written before any measurement of the series (CA-46, CA-48). A red threshold is a surface decision taken by ADR (ADR-0057 section 3), never a revision of the threshold or of the ceiling."
    exit_criteria:
      - id: "p04-series-green"
        text: "Série du protocole verte (CA-43, CA-44): the measurement series of tools/qualification/p04-tauri/PROTOCOL.md, replayed in the built shell on the declared machine and the CR-10k corpus, is green on every threshold, checked by tools/qualification/p04-tauri/check-report.ts. Resident memory ceiling of NFR-10: 500 Mio (application + index + interface, lifetime peak over 60 launches), frozen before any measurement."
        weight: 1
        status: "pending"
hypothesis: "The intended uses described in README.md can support a useful bounded product once their activation criteria are independently qualified."
