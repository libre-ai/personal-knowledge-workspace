# SPDX-License-Identifier: EUPL-1.2
# The macOS arm64 run of the composition check, the native tests and the
# notebook-core WASM build. Its WebKit browser steps served apps/notebook,
# retired from the tree on 2026-11-23 (owner decision). The file name, the
# workflow name and the job id are kept: `webkit-macos` is a required status
# check of the served branch's ruleset, docs/cahier-des-charges.md (CA-3, CA-4)
# cites the file and the workflow name, and renaming them is the owner's change.
name: Notebook WebKit macOS

'on':
  push:
    branches: [main, migrate/recover-code]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-macos:
    # GitHub's macos-15 image is ARM64; verify the actual host before downloads.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-15
    timeout-minutes: 90
    env:
      INPUT_TARGET_REF: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify macOS ARM64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import os
          import re
          if re.fullmatch('[0-9a-f]{40}', os.environ['INPUT_TARGET_REF']) is None:
              raise SystemExit('Exact target revision required')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false
      - name: Checkout immutable composition tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libre-ai/project-governance
          ref: fb4a20fa7b0cd0eef76b59c55e22d6e73817bcd7
          path: tooling
          persist-credentials: false
      - name: Test macOS installer boundaries
        run: python3 -B -m unittest discover -s source/.github/scripts -p 'test_install_macos_toolchains.py'
      - name: Prepare pinned source composition
        run: |
          python3 -B tooling/.github/composition/run-composition.py \
            --target personal-knowledge-workspace --revision "$INPUT_TARGET_REF" \
            --root "$GITHUB_WORKSPACE/composition" --phase prepare
      - name: Install verified macOS toolchains
        run: |
          bash source/.github/scripts/install-macos-toolchains.sh \
            "$GITHUB_WORKSPACE/tooling/toolchains/bun.json" \
            "$GITHUB_WORKSPACE/tooling/toolchains/notebook-qualification.json"
      - name: Install Rust compiler and WASM target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Install licensing checker
        run: pipx install reuse==6.3.0
      # The P02 database tests start throwaway PostgreSQL clusters and refuse
      # to pass without server binaries; the macOS image ships none (the
      # Linux composition job uses the image's PostgreSQL 16).
      - name: Install PostgreSQL 16 for the P02 database tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install postgresql@16
          echo "P02_PG_BINDIR=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - name: Install frozen composition and run the root check
        run: |
          python3 -B tooling/.github/composition/run-composition.py \
            --target personal-knowledge-workspace --revision "$INPUT_TARGET_REF" \
            --root "$GITHUB_WORKSPACE/composition" --phase check
      - name: Preload locked native dependencies
        working-directory: composition/personal-knowledge-workspace
        run: cargo fetch --locked
      # The P02 database tests start throwaway PostgreSQL clusters and refuse
      # to pass without server binaries; the macOS image ships none (the
      # Linux composition job uses the image's PostgreSQL 16).
      - name: Install PostgreSQL 16 for the P02 database tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install postgresql@16
          echo "P02_PG_BINDIR=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - name: Run native workspace tests
        run: |
          python3 -B tooling/.github/composition/check-products.py \
            --root "$GITHUB_WORKSPACE/composition" --target personal-knowledge-workspace --gate native \
            --bun "$(command -v bun)" --cargo "$(command -v cargo)" --node "$(command -v node)"
      - name: Build current notebook-core WASM
        run: |
          python3 -B tooling/.github/composition/check-products.py \
            --root "$GITHUB_WORKSPACE/composition" --target personal-knowledge-workspace --gate wasm \
            --bun "$(command -v bun)" --cargo "$(command -v cargo)" --node "$(command -v node)"
