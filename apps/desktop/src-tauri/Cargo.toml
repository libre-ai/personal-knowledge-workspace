[package]
name = "libre-ai-p04-desktop"
version = "0.1.0"
description = "P04 desktop shell: Tauri 2 around the Rust core, under the six controls of ADR-0057 section 2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "libre_ai_p04_desktop"

[[bin]]
name = "libre-ai-p04-desktop"
path = "src/main.rs"

# The shell test launches a real WKWebView, which needs the main thread of its
# process: libtest would run it on a worker thread, so the target owns `main`.
[[test]]
name = "shell_controls"
harness = false

# Test support for the editor's Playwright run (CA-41): the bridge of the shell on
# the mock runtime, behind a loopback HTTP port. A port is exactly what the shell
# must never open (control C6), so the binary exists only under the feature below,
# which `default` never enables; `tests/editor/harness.test.ts` pins both.
[[bin]]
name = "e2e-harness"
path = "src/bin/e2e_harness.rs"
required-features = ["e2e-harness"]

[features]
e2e-harness = ["tauri/test"]
# Production behaviour is the only behaviour: `frontendDist` is embedded in the
# binary and served through the private scheme, and `devUrl` is never read. It is
# the default so that no build, test or qualification run exercises a different
# shell from the one that ships (Tauri's own convention leaves it to `tauri build`).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
libre-ai-notebook-vault = { path = "../../../crates/notebook-vault" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true

# The shell is a macOS application (ADR-0057): the native picker of the vault root
# exists there; elsewhere the picker offers nothing and `choose_vault` refuses.
[target.'cfg(target_os = "macos")'.dependencies]
rfd.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
